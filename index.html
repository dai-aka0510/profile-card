<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私のプロフィール</title>
  <!-- Tailwind CSS（見た目を整えるペンキ）をネット経由で読み込むブロック -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- ★ここから：プロフィールカードという「大きなレゴブロック」 -->
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center space-y-6">

    <!-- 1. アイコン（丸い写真のブロック） -->
    <div class="mx-auto w-24 h-24 mb-6">
        <img 
            src="photo.jpg" 
            alt="プロフィールの写真"
            class="w-full h-full rounded-full object-cover shadow-md border-4 border-white transition duration-300 hover:scale-110 hover:rotate-6 cursor-pointer"
        >
    </div>

    <!-- 2. 名前・肩書きブロック -->
    <div>
      <h1 class="text-2xl font-bold text-gray-800">あけじぃー</h1>
      <p class="text-indigo-600 font-medium mt-1">駆け出しエンジニア / 通訳会計アプリ開発中</p>
    </div>

    <!-- 3. 自己紹介文章ブロック -->
    <p class="text-gray-600 text-sm leading-relaxed">
      ランテックで卒制制作中！プログラミングを楽しむ練習中！<br>
      パーツ（コード）を組み合わせて、新しいものを作るのが好きです。<br>
      今後はレゴブロックを楽しむように、プログラミングを学んでいきたいです。
    </p>

    <!-- 4. 好きなこと・タグのブロック -->
    <div class="flex flex-wrap justify-center gap-2 pt-2">
      <span class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1 rounded-full font-medium">🧩 レゴ</span>
      <span class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1 rounded-full font-medium">☕️ コーヒー</span>
      <span class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1 rounded-full font-medium">🚀 Rails</span>
    </div>

    <!-- 5. アクションボタンのブロック -->
    <div class="pt-4">
      <button onclick="showMessage()" class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 cursor-pointer">
  メッセージを送る（ボタン）
      </button>
    </div>

  </div>
  <!-- ★ここまで -->

  <script>
    function showMessage() {
      alert("🎉 メッセージが送信されました！\nみんなでがんばろう！");
    }
  </script>

</body>
</html>
